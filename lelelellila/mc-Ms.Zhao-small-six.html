<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mc-Ms.Zhao-small-six</title>
<style>
  :root {
    --zinc-950: #09090b;
    --zinc-900: #18181b;
    --zinc-800: #27272a;
    --zinc-600: #52525b;
    --zinc-400: #a1a1aa;
    --zinc-200: #e4e4e7;
    --slate-500: #64748b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, var(--zinc-800), var(--zinc-950) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    animation: fadeUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .gif-wrap {
    position: relative;
    animation: bounce 2.6s ease-in-out infinite;
  }

  .gif-wrap img {
    display: block;
    width: min(60vw, 420px);
    height: auto;
    border-radius: 18px;
    box-shadow: 0 0 60px rgba(148, 163, 184, 0.25), 0 20px 50px rgba(0, 0, 0, 0.55);
    filter: saturate(1.05);
  }

  .hint {
    position: absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--zinc-400);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  body:not(.playing) .hint {
    opacity: 1;
    animation: blink 1.4s ease-in-out infinite;
  }

  .volume-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    background: rgba(24, 24, 27, 0.72);
    border: 1px solid rgba(161, 161, 170, 0.15);
    border-radius: 999px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  .volume-card span {
    color: var(--zinc-200);
    font-size: 14px;
    letter-spacing: 1px;
  }

  .volume-card output {
    min-width: 34px;
    text-align: right;
    color: var(--slate-500);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 220px;
    height: 6px;
    border-radius: 999px;
    background: var(--zinc-600);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--zinc-200);
    border: 2px solid var(--zinc-950);
    box-shadow: 0 0 12px rgba(226, 232, 240, 0.6);
    transition: transform 0.15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--zinc-200);
    border: 2px solid var(--zinc-950);
    box-shadow: 0 0 12px rgba(226, 232, 240, 0.6);
    cursor: pointer;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
</style>
</head>
<body>
  <canvas id="particles" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></canvas>
  <main class="stage" style="position: relative; z-index: 1;">
    <div class="gif-wrap">
      <div class="hint">点击任意位置开始播放</div>
      <img src="mc-Ms.Zhao-small-six.jpg" alt="cat nao head">
    </div>

    <div class="volume-card">
      <span>音量</span>
      <input id="volume" type="range" min="0" max="100" value="50" aria-label="音量">
      <output id="volume-value" for="volume">50</output>
    </div>
  </main>

  <audio id="bgm" src="MC赵小六 - 弹舌.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById('bgm');
    const slider = document.getElementById('volume');
    const value = document.getElementById('volume-value');

    audio.volume = 0.5;

    function tryPlay() {
      const p = audio.play();
      if (p !== undefined) {
        p.then(() => document.body.classList.add('playing'))
         .catch(() => document.body.classList.remove('playing'));
      }
    }

    slider.addEventListener('input', () => {
      audio.volume = slider.value / 100;
      value.textContent = slider.value;
    });

    document.addEventListener('click', () => {
      if (audio.paused) tryPlay();
    });

    tryPlay();

    // === 粒子系统 ===
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    const particleCount = 120;

    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2 + 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 2.5 + 1;
        // 随机颜色
        this.color = `hsla(${Math.random() * 360}, 70%, 70%, ${Math.random() * 0.6 + 0.2})`;
        this.life = 0;
        this.maxLife = Math.random() * 150 + 50;
      }
      
      update(effectIntensity) {
        let cvx = this.vx;
        let cvy = this.vy;
        
        // 根据强度（音量+节拍模拟）增加速度和抖动
        if (effectIntensity > 0.3) {
          const intensity = (effectIntensity - 0.3) * 2.5; 
          cvx *= (1 + intensity * 2);
          cvy *= (1 + intensity * 2);
          
          this.x += (Math.random() - 0.5) * intensity * 12;
          this.y += (Math.random() - 0.5) * intensity * 12;
        }
        
        this.x += cvx;
        this.y += cvy;
        this.life++;
        
        if (this.x < 0 || this.x > canvas.width || 
            this.y < 0 || this.y > canvas.height || 
            this.life > this.maxLife) {
          this.reset();
        }
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 模拟音乐节拍波动 (根据时间周期变化)
      const time = Date.now() / 1000;
      const beat = Math.sin(time * 5.33) * 0.5 + 0.5; // 0 到 1 之间波动
      
      // 结合实际音量滑块和节拍，如果暂停则为0
      const effectIntensity = !audio.paused ? (audio.volume * (0.6 + 0.4 * beat)) : 0;
      
      particles.forEach(p => {
        p.update(effectIntensity);
        p.draw();
      });
      
      requestAnimationFrame(animateParticles);
    }
    
    animateParticles();
  </script>
</body>
</html>
